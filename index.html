<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Director Studio - Video & Movie Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-cyan-500/20">🎬</div>
            <div>
                <h1 class="font-bold text-base leading-tight">AI Director Studio</h1>
                <span class="text-xs text-cyan-400 font-medium">v3.3 Stable Edition</span>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="saveProject()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-medium rounded-lg border border-slate-700 transition">💾 সেভ</button>
            <button onclick="exportVideo()" id="exportBtn" class="px-3 py-1.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-xs font-bold rounded-lg shadow-md shadow-cyan-500/20 transition">⚡ এক্সপোর্ট MP4</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6 pb-20">

        <!-- Stage / Canvas Preview -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> লাইভ স্টুডিও প্রিভিউ
                </span>
                <span id="renderStatus" class="text-xs text-amber-400 font-medium">প্রস্তুত</span>
            </div>
            
            <div class="aspect-video bg-black rounded-xl overflow-hidden relative border border-slate-800 flex items-center justify-center">
                <canvas id="previewCanvas" width="640" height="360" class="w-full h-full object-cover"></canvas>
                <div id="subtitleOverlay" class="absolute bottom-4 left-4 right-4 text-center bg-black/70 backdrop-blur-md px-4 py-2 rounded-lg text-sm font-medium text-cyan-300 border border-cyan-500/30">
                    "প্রজেক্ট লোড হয়েছে... স্ক্রিপ্ট লিখুন বা প্লে বাটনে চাপুন।"
                </div>
            </div>

            <div class="mt-4 flex items-center justify-center gap-4">
                <button onclick="togglePlayPreview()" id="playPauseBtn" class="px-6 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg shadow-cyan-500/30 transition flex items-center gap-2">
                    ▶ প্রিভিউ চালু করুন
                </button>
            </div>
        </div>

        <!-- Script & AI Director Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">১. AI Director & Script-to-Video</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1.5">আপনার সিনেমার গল্প বা দৃশ্য বর্ণনা লিখুন:</label>
                <textarea id="scriptInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition" placeholder="যেমন: একটি সুন্দর গ্রামে সকালবেলা কুয়াশা পড়ছে, একটি ছেলে সাইকেল চালিয়ে স্কুলে যাচ্ছে..."></textarea>
            </div>
            <div class="flex gap-2">
                <button onclick="generateScenes()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition shadow-md shadow-indigo-600/20">✨ দৃশ্য ও শট এআই দিয়ে সাজান</button>
                <button onclick="enhancePrompt()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-semibold rounded-xl text-xs border border-slate-700 transition">🪄 প্রম্পট উন্নত করুন</button>
            </div>
        </div>

        <!-- Bangla Voice Studio -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">২. বাংলা Text-to-Audio স্টুডিও</h2>
            <div>
                <label class="block text-xs text-slate-400 mb-1.5">ডায়ালগ বা ভয়েসওভার টেক্সট:</label>
                <textarea id="voiceText" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition">"ভোর হলো, কুয়াশা ভেদ করে নতুন সূর্যের আলো ছড়িয়ে পড়লো গ্রামের চারপাশে।"</textarea>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="playVoiceAudio()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-xs transition shadow-md shadow-emerald-600/20">🗣️ টেস্ট ভয়েস শুনুন</button>
            </div>
        </div>

        <!-- Music Studio -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">৩. Music & SFX Studio</h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="playBGM('cinematic')" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 transition">🎵 সিনেমেটিক বিজিএম</button>
                <button onclick="playBGM('suspense')" class="py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 transition">⚡ থ্রিলার/সাসপেন্স</button>
                <button onclick="stopBGM()" class="py-2 bg-rose-900/40 hover:bg-rose-900/60 border border-rose-800/50 rounded-xl text-xs font-medium text-rose-300 transition">⏹️ বন্ধ করুন</button>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let isPlaying = false;
        let audioCtx = null;
        let bgmOscillator = null;

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        let frameCount = 0;

        function drawScene() {
            ctx.fillStyle = '#05050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            let time = frameCount * 0.02;
            gradient.addColorStop(0, `hsl(${Math.sin(time) * 30 + 200}, 70%, 15%)`);
            gradient.addColorStop(1, '#020205');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(6, 182, 212, 0.5)';
            for (let i = 0; i < 20; i++) {
                let h = Math.abs(Math.sin(time + i * 0.5)) * 50;
                ctx.fillRect(i * 33 + 10, canvas.height - h - 20, 20, h);
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('AI Director Studio Preview', canvas.width / 2, 50);

            if (isPlaying) {
                frameCount++;
                requestAnimationFrame(drawScene);
            }
        }
        drawScene();

        function togglePlayPreview() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('playPauseBtn');
            if (isPlaying) {
                btn.innerHTML = '⏸ প্রিভিউ থামান';
                btn.className = 'px-6 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg transition flex items-center gap-2';
                drawScene();
                playVoiceAudio();
            } else {
                btn.innerHTML = '▶ প্রিভিউ চালু করুন';
                btn.className = 'px-6 py-2.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-xl text-sm shadow-lg transition flex items-center gap-2';
                stopBGM();
            }
        }

        function playVoiceAudio() {
            const text = document.getElementById('voiceText').value;
            if(!text) return;
            document.getElementById('subtitleOverlay').innerText = `"${text}"`;

            try {
                const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=bn&client=tw-ob`;
                const audio = new Audio(ttsUrl);
                audio.play().catch(err => {
                    speakFallback(text);
                });
            } catch (e) {
                speakFallback(text);
            }
        }

        function speakFallback(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                window.speechSynthesis.speak(utterance);
            }
        }

        function playBGM(type) {
            stopBGM();
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgmOscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                bgmOscillator.type = type === 'cinematic' ? 'triangle' : 'sawtooth';
                bgmOscillator.frequency.setValueAtTime(type === 'cinematic' ? 120 : 80, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                bgmOscillator.connect(gain);
                gain.connect(audioCtx.destination);
                bgmOscillator.start();
            } catch (e) {
                console.log("Audio Context info:", e);
            }
        }

        function stopBGM() {
            if (bgmOscillator) {
                try { bgmOscillator.stop(); } catch(e){}
                bgmOscillator = null;
            }
        }

        function generateScenes() {
            const script = document.getElementById('scriptInput').value;
            if(!script) {
                alert("দয়া করে আগে কিছু গল্প বা স্ক্রিপ্ট লিখুন!");
                return;
            }
            alert("সফলভাবে স্ক্রিপ্টটি দৃশ্য ও শটে ভাগ করা হয়েছে!");
        }

        function enhancePrompt() {
            const scriptInput = document.getElementById('scriptInput');
            scriptInput.value = "Cinematic 4K shot, hyper-realistic, dramatic lighting: " + scriptInput.value;
        }

        function saveProject() {
            localStorage.setItem('ai_studio_project', document.getElementById('scriptInput').value);
            alert("প্রজেক্ট সফলভাবে সেভ হয়েছে!");
        }

        // Stable Video Recording Function with Live Countdown Status
        function exportVideo() {
            const statusLabel = document.getElementById('renderStatus');
            statusLabel.innerText = "রেন্ডারিং শুরু হচ্ছে...";

            const stream = canvas.captureStream(30);
            let mimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            }

            let recorder;
            let chunks = [];

            try {
                recorder = new MediaRecorder(stream, { mimeType: mimeType });
            } catch (e) {
                recorder = new MediaRecorder(stream);
            }

            recorder.ondataavailable = function(e) {
                if (e.data && e.data.size > 0) {
                    chunks.push(e.data);
                }
            };

            recorder.onstop = function() {
                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `AI_Movie_Studio_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                statusLabel.innerText = "ডাউনলোড সম্পন্ন!";
                isPlaying = false;
                setTimeout(() => { statusLabel.innerText = "প্রস্তুত"; }, 3000);
            };

            recorder.start(100);
            isPlaying = true;
            drawScene();
            playVoiceAudio();

            // 3 Seconds Countdown UI Display
            let timeLeft = 3;
            statusLabel.innerText = `ভিডিও রেকর্ড হচ্ছে... (${timeLeft}s)`;
            
            let countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    statusLabel.innerText = `ভিডিও রেকর্ড হচ্ছে... (${timeLeft}s)`;
                } else {
                    clearInterval(countdownInterval);
                    statusLabel.innerText = "ফাইল তৈরি হচ্ছে...";
                    recorder.stop();
                }
            }, 1000);
        }
    </script>
</body>
</html>
